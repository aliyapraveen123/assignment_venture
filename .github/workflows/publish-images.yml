name: Publish images and update staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-gitops
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute immutable image tag
        id: meta
        run: echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ai-task-platform-api:${{ steps.meta.outputs.tag }}
      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ai-task-platform-worker:${{ steps.meta.outputs.tag }}
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ai-task-platform-frontend:${{ steps.meta.outputs.tag }}

  update-staging:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: aliyapraveen123/ai-platform-infra
          ref: main
          token: ${{ secrets.AI_INFRA_TOKEN }}
          path: infra
      - name: Set staging image tag
        env:
          IMAGE_TAG: ${{ needs.publish.outputs.image-tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          sed -i "s/your-dockerhub-user/${DOCKERHUB_USERNAME}/g" infra/k8s/overlays/staging/kustomization.yaml
          sed -i "s/newTag: .*/newTag: ${IMAGE_TAG}/" infra/k8s/overlays/staging/kustomization.yaml
      - name: Commit and push staging promotion
        working-directory: infra
        env:
          IMAGE_TAG: ${{ needs.publish.outputs.image-tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/staging/kustomization.yaml
          if git diff --cached --quiet; then
            echo "Staging already points to ${IMAGE_TAG}."
            exit 0
          fi
          git commit -m "Deploy staging images ${IMAGE_TAG}"
          git push