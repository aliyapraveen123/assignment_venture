name: Promote staging image to production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable image tag already deployed and verified in staging (sha-...)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: infra-gitops
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.INFRA_REPOSITORY }}
          ref: main
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra
      - name: Validate immutable image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^sha-[0-9a-f]{40}$ ]]; then
            echo "Production promotion requires a full immutable sha-... image tag." >&2
            exit 1
          fi
          if ! grep -Fxq "    newTag: ${IMAGE_TAG}" infra/k8s/overlays/staging/kustomization.yaml; then
            echo "The requested image tag is not currently deployed in the staging overlay." >&2
            exit 1
          fi
      - name: Set production image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          sed -i "s/your-dockerhub-user/${DOCKERHUB_USERNAME}/g" infra/k8s/overlays/production/kustomization.yaml
          sed -i "s/newTag: .*/newTag: ${IMAGE_TAG}/" infra/k8s/overlays/production/kustomization.yaml
      - name: Commit and push production promotion
        working-directory: infra
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/production/kustomization.yaml
          if git diff --cached --quiet; then
            echo "Production already points to ${IMAGE_TAG}."
            exit 0
          fi
          git commit -m "Promote production images ${IMAGE_TAG}"
          git push